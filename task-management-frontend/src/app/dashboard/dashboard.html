<mat-toolbar color="primary" class="px-6">
  <span class="text-lg font-semibold">
    Secure Task Management
  </span>

  <span class="flex-1"></span>

  <button
    mat-button
    (click)="logout()"
    class="font-medium"
  >
    Logout
  </button>
</mat-toolbar>

<div class="max-w-6xl mx-auto px-4 py-8">

  <mat-card class="p-6 mb-8 rounded-xl shadow-md">
    <h2 class="text-2xl font-semibold text-gray-800 mb-1">
      Welcome, {{ role }}
    </h2>
    <p class="text-gray-600">
      Select an action below
    </p>
  </mat-card>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

    <mat-card
      routerLink="/tasks"
      class="p-6 rounded-xl shadow-md cursor-pointer
             hover:shadow-lg hover:scale-[1.02]
             transition-all duration-300"
    >
      <h3 class="text-xl font-semibold text-gray-800 mb-2">
        View Tasks
      </h3>
      <p class="text-gray-600">
        See tasks assigned to you
      </p>
    </mat-card>

    <!-- Admin & Manager Only -->
    <mat-card
      *ngIf="role === 'Admin' || role === 'Manager'"
      routerLink="/tasks/create"
      class="p-6 rounded-xl shadow-md cursor-pointer
             hover:shadow-lg hover:scale-[1.02]
             transition-all duration-300"
    >
      <h3 class="text-xl font-semibold text-gray-800 mb-2">
        Create Task
      </h3>
      <p class="text-gray-600">
        Assign a new task
      </p>
    </mat-card>

  </div>
</div>
